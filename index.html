<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Простой трекер задач</title>
    <meta name="theme-color" content="#246b49" />
    <meta name="apple-mobile-web-app-title" content="Планы" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="tracker" aria-label="Простой трекер задач">
        <header class="header">
          <div>
            <p class="date-line" id="dateLine"></p>
            <h1>Планы</h1>
          </div>
          <button class="settings-button" id="settingsButton" type="button" aria-label="Настройки" title="Настройки">
            <span aria-hidden="true">⚙</span>
          </button>
        </header>

        <nav class="tabs" aria-label="Периоды планирования">
          <button class="tab is-active" type="button" data-plan="work">
            <span class="tab-icon" aria-hidden="true">●</span>
            <span class="tab-label">В работе</span>
          </button>
          <button class="tab" type="button" data-plan="completed">
            <span class="tab-icon" aria-hidden="true">✓</span>
            <span class="tab-label">Выполненные</span>
          </button>
        </nav>

        <form class="add-form" id="taskForm">
          <input
            id="taskInput"
            type="text"
            placeholder="Добавить задачу"
            autocomplete="off"
            required
          />
          <button class="add-button" type="submit">
            <span class="add-icon" aria-hidden="true">+</span>
            <span class="add-label">Добавить</span>
          </button>
        </form>

        <section class="overview" aria-label="Сводка по планам">
          <button class="plan-card is-current" type="button" data-plan-card="today">
            <span id="todayCount">0</span>
            <strong>Сегодня</strong>
          </button>
          <button class="plan-card" type="button" data-plan-card="tomorrow">
            <span id="tomorrowCount">0</span>
            <strong>Завтра</strong>
          </button>
          <button class="plan-card" type="button" data-plan-card="week">
            <span id="weekCount">0</span>
            <strong>Неделя</strong>
          </button>
          <button class="plan-card" type="button" data-plan-card="month">
            <span id="monthCount">0</span>
            <strong>Месяц</strong>
          </button>
          <button class="plan-card" type="button" data-plan-card="year">
            <span id="yearCount">0</span>
            <strong>Год</strong>
          </button>
          <button class="plan-card" type="button" data-plan-card="habits">
            <span id="habitsCount">0</span>
            <strong>Привычки</strong>
          </button>
        </section>

        <section class="list-panel" aria-live="polite">
          <div class="list-head">
            <h2 id="planTitle">Сегодня</h2>
            <p id="planHint">Главный фокус на день.</p>
          </div>

          <ul class="task-list" id="taskList"></ul>

          <div class="empty-state" id="emptyState">
            <h3>Здесь пока чисто</h3>
            <p id="emptyHint">Добавь одну задачу, которую действительно хочется сделать.</p>
          </div>

          <div class="habits-panel" id="habitsPanel" hidden>
            <div class="habit-list" id="habitList"></div>
            <form class="habit-form" id="habitForm">
              <input id="habitInput" type="text" placeholder="Новая привычка" autocomplete="off" required />
              <label class="color-field" for="habitColor">
                <span id="habitColorLabel">Цвет</span>
                <input id="habitColor" type="color" value="#67c22f" aria-label="Цвет привычки" />
              </label>
              <button class="add-button habit-add-button" id="habitAddButton" type="submit">
                <span class="add-icon" aria-hidden="true">+</span>
                <span id="habitAddLabel">Добавить</span>
              </button>
            </form>
          </div>

          <div class="settings-panel" id="settingsPanel" hidden>
            <section class="settings-group" aria-labelledby="themeTitle">
              <h3 id="themeTitle">Тема</h3>
              <div class="choice-grid" id="themeChoices">
                <button class="theme-choice" type="button" data-theme="scheme1">
                  <span class="theme-dot scheme1"></span>
                  <span>Схема 1</span>
                </button>
                <button class="theme-choice" type="button" data-theme="scheme2">
                  <span class="theme-dot scheme2"></span>
                  <span>Схема 2</span>
                </button>
                <button class="theme-choice" type="button" data-theme="scheme3">
                  <span class="theme-dot scheme3"></span>
                  <span>Схема 3</span>
                </button>
                <button class="theme-choice" type="button" data-theme="scheme4">
                  <span class="theme-dot scheme4"></span>
                  <span>Схема 4</span>
                </button>
                <button class="theme-choice" type="button" data-theme="scheme5">
                  <span class="theme-dot scheme5"></span>
                  <span>Схема 5</span>
                </button>
                <button class="theme-choice" type="button" data-theme="scheme6">
                  <span class="theme-dot scheme6"></span>
                  <span>Схема 6</span>
                </button>
                <button class="theme-choice" type="button" data-theme="dark1">
                  <span class="theme-dot dark1"></span>
                  <span>Темная 1</span>
                </button>
                <button class="theme-choice" type="button" data-theme="dark2">
                  <span class="theme-dot dark2"></span>
                  <span>Темная 2</span>
                </button>
                <button class="theme-choice" type="button" data-theme="dark3">
                  <span class="theme-dot dark3"></span>
                  <span>Темная 3</span>
                </button>
                <button class="theme-choice" type="button" data-theme="dark4">
                  <span class="theme-dot dark4"></span>
                  <span>Темная 4</span>
                </button>
                <button class="theme-choice" type="button" data-theme="dark5">
                  <span class="theme-dot dark5"></span>
                  <span>Темная 5</span>
                </button>
                <button class="theme-choice" type="button" data-theme="dark6">
                  <span class="theme-dot dark6"></span>
                  <span>Темная 6</span>
                </button>
              </div>
            </section>

            <section class="settings-group" aria-labelledby="languageTitle">
              <h3 id="languageTitle">Язык</h3>
              <div class="segmented">
                <button class="lang-choice" type="button" data-lang="ru">Русский</button>
                <button class="lang-choice" type="button" data-lang="en">English</button>
              </div>
            </section>

            <section class="settings-group" aria-labelledby="cleanupTitle">
              <h3 id="cleanupTitle">Очистка</h3>
              <button class="quiet-button danger-button" id="clearDone" type="button">
                Убрать выполненные
              </button>
            </section>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
